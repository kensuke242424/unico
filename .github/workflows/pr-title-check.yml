name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prTitle = context.payload.pull_request.title;
            const taskIdPattern = /\[TASK-\d{4}\]/;

            const hasTaskId = taskIdPattern.test(prTitle);

            if (!hasTaskId) {
              // PRタイトルにTASK-XXXXが含まれていない場合、コメントを追加
              const comment = `## ⚠️ PRタイトルの形式エラー

PRタイトルに \`[TASK-XXXX]\` の形式でチケットIDを含めてください。

### 正しい例：
- \`[TASK-0001] ユーザー認証機能の追加\`
- \`[TASK-0042] バグ修正: ログイン画面のレイアウト崩れ\`

### 現在のタイトル：
\`${prTitle}\`

---

**修正方法：**
1. PRタイトルを編集
2. ブランチ名から取得したチケットIDを \`[TASK-XXXX]\` の形式で追加`;

              // 既存のコメントをチェックして重複を避ける
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

              const botComment = comments.data.find(
                c => c.user.type === 'Bot' && c.body.includes('PRタイトルの形式エラー')
              );

              if (!botComment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
              }

              core.setFailed('PRタイトルに [TASK-XXXX] 形式のチケットIDが含まれていません');
            } else {
              console.log('✅ PRタイトルの形式チェック: 成功');
            }
