name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title Format
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prTitle = context.payload.pull_request.title;
            const issueNumberPattern = /\[#\d+\]/;

            const hasIssueNumber = issueNumberPattern.test(prTitle);

            if (!hasIssueNumber) {
              // PRタイトルに#XXが含まれていない場合、コメントを追加
              const comment = `## ⚠️ PRタイトルの形式エラー\n\nPRタイトルに \`[#XX]\` の形式でIssue番号を含めてください。\n\n### 正しい例：\n- \`[#1] ユーザー認証機能の追加\`\n- \`[#42] バグ修正: ログイン画面のレイアウト崩れ\`\n\n### 現在のタイトル：\n\`${prTitle}\`\n\n---\n\n**修正方法：**\n1. PRタイトルを編集\n2. ブランチ名から取得したIssue番号を \`[#XX]\` の形式で追加`;

              // 既存のコメントをチェックして重複を避ける
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

              const botComment = comments.data.find(
                c => c.user.type === 'Bot' && c.body.includes('PRタイトルの形式エラー')
              );

              if (!botComment) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
              }

              core.setFailed('PRタイトルに [#XX] 形式のIssue番号が含まれていません');
            } else {
              console.log('✅ PRタイトルの形式チェック: 成功');
            }
