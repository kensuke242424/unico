name: Issue Auto ID

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  add-task-id:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Task ID
        id: generate_id
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          TASK_ID=$(printf "TASK-%04d" $ISSUE_NUMBER)
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
          echo "Generated Task ID: $TASK_ID"

      - name: Update Issue Title and Body with Task ID
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const taskId = '${{ steps.generate_id.outputs.task_id }}';
            const issueNumber = context.issue.number;
            const currentTitle = context.payload.issue.title;
            const currentBody = context.payload.issue.body || '';

            // タイトルにすでにTASK-XXXXが含まれているかチェック
            const titleHasTaskId = /^TASK-\d{4}\s/.test(currentTitle);
            const updatedTitle = titleHasTaskId ? currentTitle : `${taskId} ${currentTitle}`;

            // Issue本文の先頭にタスクIDを追記
            const updatedBody = `## 📋 チケットID\n\`${taskId}\`\n\n---\n\n${currentBody}`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              title: updatedTitle,
              body: updatedBody
            });

      - name: Add Branch Name Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const taskId = '${{ steps.generate_id.outputs.task_id }}';
            const issueNumber = context.issue.number;
            const labels = context.payload.issue.labels.map(label => label.name);

            // ラベルに応じてブランチプレフィックスを決定
            let branchPrefix = 'feature';
            let exampleSuffix = 'add-new-feature';

            if (labels.includes('bug')) {
              branchPrefix = 'bugfix';
              exampleSuffix = 'fix-issue-description';
            } else if (labels.includes('hotfix')) {
              branchPrefix = 'hotfix';
              exampleSuffix = 'urgent-fix';
            } else if (labels.includes('enhancement')) {
              branchPrefix = 'feature';
              exampleSuffix = 'improve-feature';
            }

            const branchPrefix_withTaskId = `${branchPrefix}/${taskId}-`;

            const comment = `## 🌿 推奨ブランチ名\n\n作業を開始する際は、以下をコピーして使用してください：\n\n\`\`\`bash\ngit checkout -b ${branchPrefix_withTaskId}\n# ↑ 末尾に作業内容を英語で追加してください（例: fix-modal-bug, add-user-auth）\n\`\`\`\n\n---\n\n### 📌 ブランチ命名ルール\n- **feature/TASK-XXXX-<description>**: 新機能追加\n- **bugfix/TASK-XXXX-<description>**: バグ修正\n- **hotfix/TASK-XXXX-<description>**: 緊急修正\n\n**形式：** 小文字、ハイフン区切りで記述\n\n### 💡 コミットメッセージ\nコミット時、自動で \`[${taskId}]\` がメッセージ先頭に追加されます（Git hook設定済みの場合）。\n\n手動で付与する場合：\n\`\`\`bash\ngit commit -m "[${taskId}] 実装内容の説明"\n\`\`\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });
